    html {
      background: linear-gradient(180deg, #f6cdd3 0%, #f6cdd3 12%, #f7d8de 32%, #f6d3da 55%, #f7d3da 100%) fixed;

      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 9.5vw, 5rem);
      line-height: 1.2;
      color: #9f1244;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.7);
    }

    .ln { display: block; }
    .word { display: inline-block; white-space: nowrap; }
    .name { color: #d6215f; }

    .content { max-width: 780px; width: 100%; }

    /* botones Sí / No (aparecen cuando termina de escribirse el texto) */
    .choices {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: clamp(22px, 5vh, 40px);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .choices.show { opacity: 1; transform: none; pointer-events: auto; }

    .btn {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      line-height: 1;
      text-decoration: none;
      padding: 12px 34px 14px;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn.yes {
      color: #fff;
      background: linear-gradient(180deg, #f2487f, #d6215f);
      box-shadow: 0 6px 18px rgba(214, 33, 95, 0.4);
    }
    .btn.no {
      color: #9f1244;
      background: rgba(255, 255, 255, 0.75);
      border: 1.5px solid #e58aa8;
      box-shadow: 0 6px 18px rgba(159, 18, 68, 0.12);
    }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-2px); }
    }

    /* cada letra ocupa su lugar desde el inicio; solo se revela al "escribirse" */
    .c { opacity: 0; position: relative; }
    .c.on { opacity: 1; }

    /* cursor parpadeante, sin mover el texto */
    .c.last::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 0.12em;
      width: 2px;
      height: 0.85em;
      background: #9f1244;
      animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .c { opacity: 1; }
      .c.last::after { display: none; }
    }

<body>
  <main class="content">
    <h1 id="title" aria-label="¿Podemos hablar de nuevo, Madeline?">
      <span class="ln">¿Podemos hablar</span>
      <span class="ln">de nuevo, <span class="name">Madeline?</span></span>
    </h1>

    <div class="choices" id="choices">
      <a class="btn yes" target="_blank" rel="noopener"
         href="https://wa.me/528129016051?text=Hola%2C%20vi%20tu%20p%C3%A1gina.%20Mi%20respuesta%20es%3A%20S%C3%8D%2C%20podemos%20hablar%20%F0%9F%92%97">Sí</a>
      <a class="btn no" target="_blank" rel="noopener"
         href="https://wa.me/528129016051?text=Hola%2C%20vi%20tu%20p%C3%A1gina.%20Mi%20respuesta%20es%3A%20NO%2C%20por%20ahora%20prefiero%20que%20no.">No</a>
    </div>
  </main>
  <noscript><style>.choices { opacity: 1 !important; pointer-events: auto !important; transform: none !important; }</style></noscript>

  <script>
    (function () {
      var h1 = document.getElementById("title");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Se arma el texto con una <span> por letra (agrupadas por palabra para que no se partan)
      var lines = [
        [["¿Podemos hablar", ""]],
        [["de nuevo, ", ""], ["Madeline?", "name"]]
      ];

      h1.textContent = "";
      var letters = [];

      lines.forEach(function (parts) {
        var ln = document.createElement("span");
        ln.className = "ln";
        ln.setAttribute("aria-hidden", "true");
        parts.forEach(function (p) {
          var holder = p[1] ? document.createElement("span") : ln;
          if (p[1]) holder.className = p[1];
          p[0].split(/(\s+)/).forEach(function (chunk) {
            if (!chunk) return;
            if (/^\s+$/.test(chunk)) { holder.appendChild(document.createTextNode(" ")); return; }
            var w = document.createElement("span");
            w.className = "word";
            chunk.split("").forEach(function (ch) {
              var c = document.createElement("span");
              c.className = "c";
              c.textContent = ch;
              w.appendChild(c);
              letters.push(c);
            });
            holder.appendChild(w);
          });
          if (p[1]) ln.appendChild(holder);
        });
        h1.appendChild(ln);
      });

      var choices = document.getElementById("choices");
      function showChoices() { choices.classList.add("show"); }

      if (reduce) { letters.forEach(function (c) { c.classList.add("on"); }); showChoices(); return; }

      var i = 0, prev = null;
      function typeNext() {
        if (i >= letters.length) { setTimeout(showChoices, 700); return; }
        var c = letters[i++];
        if (prev) prev.classList.remove("last");
        c.classList.add("on", "last");
        prev = c;
        var ch = c.textContent;
        var delay = 70 + Math.random() * 70;
        if (ch === ",") delay += 350;
        else if (i === 15) delay += 450; // pausa al terminar la primera línea
        setTimeout(typeNext, delay);
      }
      setTimeout(typeNext, 700);
    })();
  </script>
